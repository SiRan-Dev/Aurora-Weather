name: Build iOS IPA (unsigned)

# 手动触发，在 GitHub 的 macOS runner 上打出未签名 IPA 并作为 artifact 上传。
# 默认从仓库 Secrets 读取密钥（Settings → Secrets and variables → Actions）；
# workflow_dispatch 的输入只用于临时覆盖，会出现在运行记录里，不建议填长期密钥。

on:
  workflow_dispatch:
    inputs:
      qweather_api_key:
        description: '可选：临时覆盖 Secret QWEATHER_API_KEY'
        required: false
        default: ''
      qweather_base_url:
        description: '可选：临时覆盖 Secret QWEATHER_BASE_URL（形如 https://xxxx.qweatherapi.com/v7）'
        required: false
        default: ''
      caiyun_api_key:
        description: '可选：临时覆盖 Secret CAIYUN_API_KEY'
        required: false
        default: ''
      amap_web_key:
        description: '可选：临时覆盖 Secret AMAP_WEB_KEY（Web服务 key，定位/城市搜索用）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  ios-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本号以最新 git tag 为准（与 build-and-release.yml 一致），
      # 避免 pubspec.yaml 的 version 不跟着 tag 升导致产物版本号漂移。
      - name: Get version from git tag
        id: version
        run: |
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          [[ -z "$TAG" ]] && TAG="v0.0.0"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      # .env 是 pubspec 里声明的 asset，构建前必须存在。
      # 输入的密钥通过 env 传入，脚本里只用变量名，避免值出现在日志中。
      - name: Create .env
        env:
          IN_QWEATHER: ${{ inputs.qweather_api_key || secrets.QWEATHER_API_KEY }}
          IN_QWEATHER_BASE: ${{ inputs.qweather_base_url || secrets.QWEATHER_BASE_URL }}
          IN_CAIYUN: ${{ inputs.caiyun_api_key || secrets.CAIYUN_API_KEY }}
          IN_AMAP_WEB: ${{ inputs.amap_web_key || secrets.AMAP_WEB_KEY }}
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            echo "using existing .env"
          else
            cp .env.example .env
          fi

          set_key() {
            key="$1"
            val="$2"
            if [ -z "$val" ]; then
              return 0
            fi
            grep -v "^${key}=" .env > .env.tmp || true
            printf '%s=%s\n' "$key" "$val" >> .env.tmp
            mv .env.tmp .env
          }

          set_key QWEATHER_API_KEY "$IN_QWEATHER"
          set_key QWEATHER_BASE_URL "$IN_QWEATHER_BASE"
          set_key CAIYUN_API_KEY "$IN_CAIYUN"
          set_key AMAP_WEB_KEY "$IN_AMAP_WEB"

          echo "--- .env 概况（值已隐藏）---"
          sed -E 's/^([A-Za-z_]+)=.*/\1=<set>/' .env
          echo "QWeather key supplied: $([ -n "$IN_QWEATHER" ] && echo yes || echo no)"
          echo "QWeather host supplied: $([ -n "$IN_QWEATHER_BASE" ] && echo yes || echo no)"
          echo "Amap web key supplied: $([ -n "$IN_AMAP_WEB" ] && echo yes || echo no)"

          if grep -q '^QWEATHER_API_KEY=your_' .env; then
            echo "::warning::QWEATHER_API_KEY 未配置（Secrets 或输入为空），天气接口会返回 403"
          fi
          if grep -q '^AMAP_WEB_KEY=your_' .env; then
            echo "::warning::AMAP_WEB_KEY 未配置，定位和城市搜索会失败"
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        env:
          BUILD_NAME: ${{ steps.version.outputs.version }}
        run: flutter build ios --release --no-codesign --build-name="$BUILD_NAME" --build-number="$GITHUB_RUN_NUMBER"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_DIR="build/ios/iphoneos"
          rm -rf "$APP_DIR/Payload"
          mkdir -p "$APP_DIR/Payload"
          cp -R "$APP_DIR/Runner.app" "$APP_DIR/Payload/"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_DIR/Runner.app/Info.plist")
          cd "$APP_DIR"
          zip -qry "$GITHUB_WORKSPACE/AuroraWeather-${VERSION}-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/AuroraWeather-${VERSION}-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AuroraWeather-ipa
          path: AuroraWeather-*-unsigned.ipa
          retention-days: 7
